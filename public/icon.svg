<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* Flat two-color diagonal wash, top-left to bottom-right. Both stops are
       mid-tones on purpose: a pale stop on a circle reads as a highlight and
       turns the mark into a sphere. Light = indigo family of the page
       gradient, dark = its slate-to-plum family, lifted for dark tabs. */
    :root { --a: #aab4f7; --b: #6469de; }
    @media (prefers-color-scheme: dark) {
      :root { --a: #3a3d6b; --b: #7a477c; }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" style="stop-color: var(--a)"/>
      <stop offset="1" style="stop-color: var(--b)"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#g)"/>
</svg>
