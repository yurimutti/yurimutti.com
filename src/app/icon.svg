<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* Light: the page gradient's indigo family, stretched from its palest
       stop to a deeper indigo so both ends read on a light tab.
       Dark: the page's slate-to-plum gradient, lifted so it reads on a dark
       tab. Same circle, only the colors change. */
    :root { --a: #e0e7ff; --b: #7c86f5; }
    @media (prefers-color-scheme: dark) {
      :root { --a: #4b4f74; --b: #9a5f9c; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: var(--a)"/>
      <stop offset="1" style="stop-color: var(--b)"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#g)"/>
</svg>
