<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --a: #f2f4ff; --b: #c7d2fe; --edge: #b7c2fa;
      --c: #b4bffb; --d: #96a3f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --a: #30323f; --b: #3a2739; --edge: #56455f;
        --c: #57466a; --d: #7a6188;
      }
    }
  </style>
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: var(--a)"/>
      <stop offset="1" style="stop-color: var(--b)"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: var(--c)"/>
      <stop offset="1" style="stop-color: var(--d)"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31.5" fill="url(#outer)" stroke="var(--edge)" stroke-width="1"/>
  <circle cx="38" cy="38" r="15" fill="url(#inner)"/>
</svg>
